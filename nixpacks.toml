[providers]
nodejs = "22"

[phases.setup]
nixPkgs = ["nodejs-22_x", "yarn", "python3", "gcc", "gnumake"]

[phases.install]
cmd = "corepack enable && corepack prepare yarn@4.9.2 --activate && yarn install --frozen-lockfile"

[phases.build]
cmd = "yarn build && chmod +x scripts/railway-vscode-server.mjs"

[start]
cmd = "node scripts/railway-vscode-server.mjs"

[variables]
NODE_ENV = "production"
ELECTRON_SKIP_BINARY_DOWNLOAD = "1"
PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
NPM_CONFIG_OPTIONAL = "false"
SKIP_NATIVE_MODULES = "1"
VSCODE_SKIP_NODE_VERSION_CHECK = "1"