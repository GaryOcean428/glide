# Nixpacks Configuration
# Ensure Node.js detection and proper build configuration

[phases.setup]
nixPkgs = ["nodejs_22", "npm"]

[phases.install]
cmds = [
    "npm config set registry https://registry.npmjs.org/",
    "npm config set legacy-peer-deps true", 
    "npm config set fetch-timeout 180000",
    "npm config set fetch-retries 5",
    "npm install --omit=dev --omit=optional --legacy-peer-deps"
]

[phases.build]
cmds = [
    "npm run install-essentials",
    "chmod +x scripts/railway-vscode-server.mjs"
]

[start]
cmd = "node scripts/railway-vscode-server.mjs"

[variables]
NODE_ENV = "production"
ELECTRON_SKIP_BINARY_DOWNLOAD = "1"
PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
NPM_CONFIG_OPTIONAL = "false"
VSCODE_SKIP_NODE_VERSION_CHECK = "1"