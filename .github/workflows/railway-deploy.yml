name: Railway Deployment
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          # Install jq if not available
          sudo apt-get update -qq && sudo apt-get install -y jq
          # Validate railpack.json (Railway build priority #2)
          if [ -f "railpack.json" ]; then
            jq '.' railpack.json > /dev/null
            echo "✅ railpack.json configuration valid"
            
            # Check for competing configurations (per Railway guidelines)
            competing=""
            if [ -f "Dockerfile" ]; then competing="$competing Dockerfile(#1)"; fi
            if [ -f "railway.json" ]; then competing="$competing railway.json(#3)"; fi
            if [ -f "railway.toml" ]; then competing="$competing railway.toml(#3)"; fi
            if [ -f "nixpacks.toml" ]; then competing="$competing nixpacks.toml(#4)"; fi
            
            if [ -n "$competing" ]; then
              echo "⚠️  Competing configurations detected:$competing"
              echo "   These may override railpack.json per Railway build priority"
            else
              echo "✅ No competing configurations - railpack.json will be used"
            fi
          else
            echo "❌ railpack.json not found"
            exit 1
          fi
      - run: node scripts/validate-models.js
        env:
          GIDE_MODEL_NAME: claude-sonnet-4-20250514  
          GIDE_MODEL_PROVIDER: anthropic
          VSCODE_SKIP_NODE_VERSION_CHECK: "1"

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest 
    steps:
      - uses: actions/checkout@v4
      - run: echo "Deploy to Railway triggered"